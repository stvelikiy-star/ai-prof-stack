name: ai-prof-stack

services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-prof-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Bishkek

    secrets:
      - postgres_admin_password
      - postgres_n8n_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/01-create-n8n.sh:/docker-entrypoint-initdb.d/01-create-n8n.sh:ro

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=postgres --dbname=postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    mem_limit: 768m
    cpus: "1.00"
    shm_size: 128mb

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.30.7
    container_name: ai-prof-n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - /opt/n8n/secret-entrypoint.sh

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_SCHEMA: public

      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"

      GENERIC_TIMEZONE: Asia/Bishkek
      TZ: Asia/Bishkek

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_LOG_LEVEL: info

    secrets:
      - postgres_n8n_password
      - n8n_encryption_key

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/secret-entrypoint.sh:/opt/n8n/secret-entrypoint.sh:ro

    ports:
      - "127.0.0.1:5678:5678"

    networks:
      - backend
      - outbound

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http')
          .get('http://127.0.0.1:5678/healthz/readiness',
          response => process.exit(response.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    mem_limit: 1536m
    cpus: "1.50"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
    internal: true

  outbound:
    driver: bridge

volumes:
  postgres_data:
    name: ai-prof-postgres-data

  n8n_data:
    name: ai-prof-n8n-data

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password

  postgres_n8n_password:
    file: ./secrets/postgres_n8n_password

  n8n_encryption_key:
    file: ./secrets/n8n_encryption_key
